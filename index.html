       ======================================== */

    .slide {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-color: #ffffff;

      background-repeat: no-repeat;

      background-position: center center;

      /*
        Das komplette Bild bleibt sichtbar.
      */
      background-size: contain;

      /*
        Nur Fade.
        Keine Bewegung nach links/rechts.
      */
      opacity: 0;

      transition: opacity 3s ease-in-out;

      z-index: 1;

      pointer-events: none;
    }


    .slide.current {

    /* ========================================
       NAVIGATION
       ======================================== */

    .buttons {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 100;

      /*
        WICHTIG:
        Standardmäßig komplett unsichtbar.
      */
      opacity: 0;

      /*
        Pfeile sind zunächst nicht anklickbar.
      */
      pointer-events: none;

      /*
        Sanftes Einblenden.
      */
      transition: opacity 0.4s ease;
    }


    /*
      Sobald die Maus über der gesamten
      Galerie ist, erscheinen die Pfeile.
    */

    .slider:hover .buttons {
      opacity: 1;

      pointer-events: auto;
    }


    /* ========================================
       PFEILE
       ======================================== */

    .buttons button {
      position: absolute;

      top: 50%;

      width: 44px;
      height: 44px;

      transform: translateY(-50%);

      border: 2px solid #000000;

      background: rgba(255, 255, 255, 0.85);

      color: #000000;

      cursor: pointer;

      border-radius: 50%;

      outline: none;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .buttons button#prev {

    }


    .buttons button#next {

    }


    .buttons button:hover {

      transform: translateY(-50%) scale(1.1);

       ======================================== */

  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script>

    const slides =
      document.querySelectorAll(".slide");


    const nextButton =
      document.getElementById("next");


    const prevButton =
      document.getElementById("prev");


    /*
      30 Sekunden pro Bild
    */

    const intervalTime = 30000;


    let slideInterval;


    /*
      Hier wird die zufällige Reihenfolge
      gespeichert.
    */

    let randomOrder = [];


    /*
      Aktuelle Position innerhalb
      der zufälligen Reihenfolge.
    */

    let currentPosition = 0;


    /* ========================================
       ZUFÄLLIGE REIHENFOLGE
       ======================================== */

    function createRandomOrder() {

      randomOrder = Array.from(
        { length: slides.length },
        (_, index) => index
      );


      /*
        Fisher-Yates Shuffle
      */

      for (
        let i = randomOrder.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          randomOrder[i],
          randomOrder[j]
        ] = [
          randomOrder[j],
          randomOrder[i]
        ];

      }

    }


    /* ========================================
       START
       ======================================== */

    function startRandomGallery() {

      createRandomOrder();


      currentPosition = 0;


      slides.forEach(slide => {

        slide.classList.remove("current");

      });


      slides[
        randomOrder[currentPosition]
      ].classList.add("current");

    }


    /* ========================================
       NÄCHSTES BILD
       ======================================== */

    function nextSlide() {

      currentPosition++;


      /*
        Wenn alle Bilder einmal gezeigt wurden,
        neue zufällige Reihenfolge erstellen.
      */

      if (
        currentPosition >=
        randomOrder.length
      ) {

        const previousIndex =
          randomOrder[
            randomOrder.length - 1
          ];


        createRandomOrder();


        currentPosition = 0;


        /*
          Das letzte Bild des vorherigen
          Durchlaufs darf nicht direkt
          wieder erscheinen.
        */

        if (
          randomOrder.length > 1 &&
          randomOrder[0] === previousIndex
        ) {

          const swapIndex =
            Math.floor(
              Math.random() *
              (randomOrder.length - 1)
            ) + 1;


          [
            randomOrder[0],
            randomOrder[swapIndex]
          ] = [
            randomOrder[swapIndex],
            randomOrder[0]
          ];

        }

      }


      /*
        Aktuelles Bild entfernen
      */

      const current =
        document.querySelector(".current");


      if (current) {

        current.classList.remove("current");

      }


      /*
        Neues Bild anzeigen
      */

      const next =
        slides[
          randomOrder[currentPosition]
        ];


      next.classList.add("current");

    }


    /* ========================================
       VORHERIGES BILD
       ======================================== */

    function previousSlide() {

      currentPosition--;


      if (currentPosition < 0) {

        currentPosition =
          randomOrder.length - 1;

      }


      const current =
        document.querySelector(".current");


      if (current) {

        current.classList.remove("current");

      }


      const previous =
        slides[
          randomOrder[currentPosition]
        ];


      previous.classList.add("current");

    }


    /* ========================================
       TIMER ZURÜCKSETZEN
       ======================================== */

    function resetTimer() {

      clearInterval(slideInterval);


      slideInterval =
        setInterval(
          nextSlide,
          intervalTime
        );

    }


    /* ========================================
       NEXT BUTTON
       ======================================== */

    nextButton.addEventListener(
      "click",
      () => {

        nextSlide();

        resetTimer();

      }
    );


    /* ========================================
       PREVIOUS BUTTON
       ======================================== */

    prevButton.addEventListener(
      "click",
      () => {

        previousSlide();

        resetTimer();

      }
    );


    /* ========================================
       GALERIE STARTEN
       ======================================== */

    startRandomGallery();


    /*
      Automatischer Wechsel
      alle 30 Sekunden.
    */

    slideInterval =
      setInterval(
        nextSlide,
        intervalTime
      );

  </script>
