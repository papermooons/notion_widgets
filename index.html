       ======================================== */

    * {

      margin: 0;
      padding: 0;

    /* ========================================
       SLIDER
       ======================================== */

    .slider {
      position: relative;
      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #ffffff !important;
    }


    /* ========================================
       SLIDES

       NUR FADE
       KEINE BEWEGUNG
       ======================================== */

    .slide {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      /*
        Weißer Hintergrund
      */

      background-color: #ffffff !important;

      /*
        Bild vollständig anzeigen
      */

      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;

      /*
        Unsichtbar
      */

      opacity: 0;

      /*
        KEIN translateX / KEINE Bewegung
      */

      transition: opacity 3s ease-in-out;

      z-index: 1;

      pointer-events: none;
    }


    /*
      Aktuelles Bild
    */

    .slide.current {
      opacity: 1;
      z-index: 2;
    }

    /* ========================================

    .buttons {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 100;

      pointer-events: none;
    }


    .buttons button {
      position: absolute;

      top: 50%;

      width: 44px;
      height: 44px;

      transform: translateY(-50%);

      border: 2px solid #000000;

      background: rgba(255, 255, 255, 0.85);

      color: #000000;

      cursor: pointer;

      border-radius: 50%;

      outline: none;

      pointer-events: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .buttons button#prev {
      left: 20px;
    }


    .buttons button#next {
      right: 20px;
    }


    .buttons button:hover {
      background: #000000;
      color: #ffffff;

      transform: translateY(-50%) scale(1.1);
    }


    /* ========================================
       MOBILE
       ======================================== */

  <div class="buttons">

    <button id="prev" aria-label="Vorheriges Bild">
      <i class="fas fa-arrow-left"></i>
    </button>

    <button id="next" aria-label="Nächstes Bild">
      <i class="fas fa-arrow-right"></i>
    </button>

  </div>


  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script>

    const slides = document.querySelectorAll(".slide");

    const nextButton = document.getElementById("next");
    const prevButton = document.getElementById("prev");


    /*
      ========================================
      EINSTELLUNGEN
      ========================================

      30 Sekunden Standdauer pro Bild
    */

    const auto = true;

    const intervalTime = 30000;

    let slideInterval;


    /*
      ========================================
      NÄCHSTES BILD
      ========================================
    */

    const nextSlide = () => {

      const current = document.querySelector(".current");

      current.classList.remove("current");


      if (current.nextElementSibling) {

        current.nextElementSibling.classList.add("current");

      } else {

        slides[0].classList.add("current");

      }

    };


    /*
      ========================================
      VORHERIGES BILD
      ========================================
    */

    const prevSlide = () => {

      const current = document.querySelector(".current");

      current.classList.remove("current");


      if (current.previousElementSibling) {

        current.previousElementSibling.classList.add("current");

      } else {

        slides[slides.length - 1].classList.add("current");

      }

    };


    /*
      ========================================
      NEXT BUTTON
      ========================================
    */

    nextButton.addEventListener("click", () => {

      nextSlide();


      if (auto) {

        clearInterval(slideInterval);

        slideInterval = setInterval(
          nextSlide,
          intervalTime
        );

      }

    });


    /*
      ========================================
      PREVIOUS BUTTON
      ========================================
    */

    prevButton.addEventListener("click", () => {

      prevSlide();


      if (auto) {

        clearInterval(slideInterval);

        slideInterval = setInterval(
          nextSlide,
          intervalTime
        );

      }

    });


    /*
      ========================================
      AUTOMATISCHER WECHSEL
      ========================================
    */

    if (auto) {

      slideInterval = setInterval(
        nextSlide,
        intervalTime
      );

    }

  </script>
